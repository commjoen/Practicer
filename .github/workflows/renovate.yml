name: Renovate

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'

jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Run Renovate
        uses: renovatebot/github-action@v42.0.0
        with:
          configurationFile: renovate.json
        env:
          LOG_LEVEL: info
          RENOVATE_TOKEN: ${{ secrets.GITHUB_TOKEN }}
