name: Renovate

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'

jobs:
  renovate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.0
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: info
          RENOVATE_REPOSITORIES: ${{ github.repository }}
